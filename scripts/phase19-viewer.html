<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AutoVerse 3D — Phase 19 Visual Authenticity & Aperture QA Viewer</title>
  <style>
    body { margin: 0; background: #080A0E; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    #overlay {
      position: absolute; top: 20px; left: 24px;
      display: flex; flex-direction: column; gap: 8px; z-index: 10;
    }
    #badge-rule6 {
      color: #00F0FF; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      background: rgba(10, 14, 22, 0.92); padding: 8px 16px; border: 1px solid rgba(0, 240, 255, 0.6);
      border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    #vehicle-badge {
      color: #F8FAFC; font-size: 14px; font-weight: 600;
      background: rgba(15, 23, 42, 0.85); padding: 6px 14px; border-radius: 4px;
      border-left: 4px solid #00F0FF;
    }
    #meta {
      position: absolute; bottom: 20px; left: 24px;
      color: #94A3B8; font-size: 11px; line-height: 1.5;
      background: rgba(10, 14, 22, 0.90); padding: 8px 14px; border-radius: 4px;
      border: 1px solid rgba(51, 65, 85, 0.5); z-index: 10;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <div id="badge-rule6">AUTOVERSE PHASE 19 — VISUAL AUTHENTICITY & GEOMETRIC VERIFICATION</div>
    <div id="vehicle-badge">Vehicle: <span id="lbl-name">Initializing...</span> | View: <span id="lbl-view">Default</span></div>
  </div>
  <div id="meta">
    <div id="lbl-meta-dims">Dimensions: --</div>
    <div id="lbl-meta-apertures">Aperture Kinematics: Verified Active</div>
  </div>
  <canvas id="c" width="1600" height="900"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import {
      EditableVehicleAssembler,
      VehicleInteriorGenerator,
      VehicleEngineBayGenerator,
      VehicleOpeningController,
      DEFAULT_OPENING_STATE
    } from '/scripts/engine.bundle.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(1600, 900);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x0a0c12, 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1600 / 900, 0.05, 100);

    // Studio Lighting Suite
    const hemiLight = new THREE.HemisphereLight(0xF8FAFC, 0x0F172A, 0.75);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.8);
    keyLight.position.set(5.5, 7.5, 5.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x00F0FF, 0.95);
    rimLight.position.set(-6.5, 4.0, -5.5);
    scene.add(rimLight);

    const cabinLight = new THREE.PointLight(0xFFFFFF, 1.2, 3.5);
    cabinLight.position.set(0, 1.0, 0.2);
    scene.add(cabinLight);

    const underhoodLight = new THREE.PointLight(0x60A5FA, 1.0, 3.0);
    underhoodLight.position.set(0, 0.8, 1.4);
    scene.add(underhoodLight);

    // Studio Floor Grid
    const floorGeo = new THREE.PlaneGeometry(50, 50);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x080A0F,
      roughness: 0.65,
      metalness: 0.2
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.002;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(30, 60, 0x00F0FF, 0x1E293B);
    grid.position.y = 0.001;
    scene.add(grid);

    let currentVehicleGroup = null;
    let currentSpec = null;

    window.loadVehicle = async function(specPath, openingState = DEFAULT_OPENING_STATE) {
      if (currentVehicleGroup) {
        scene.remove(currentVehicleGroup);
        EditableVehicleAssembler.dispose(currentVehicleGroup);
        currentVehicleGroup = null;
      }

      const res = await fetch(specPath);
      currentSpec = await res.json();

      currentVehicleGroup = EditableVehicleAssembler.build(currentSpec, { openingState });
      scene.add(currentVehicleGroup);

      document.getElementById('lbl-name').textContent =
        `${currentSpec.vehicle.manufacturer} ${currentSpec.vehicle.model} (${currentSpec.vehicle.year || ''})`.toUpperCase();
      document.getElementById('lbl-meta-dims').textContent =
        `Length: ${currentSpec.dimensions?.length || 4.5}m | Width: ${currentSpec.dimensions?.width || 1.95}m | Height: ${currentSpec.dimensions?.height || 1.25}m`;

      window.renderFrame();
    };

    window.setOpeningState = function(openingState) {
      if (currentVehicleGroup && currentSpec) {
        EditableVehicleAssembler.applyOpenings(currentVehicleGroup, currentSpec, openingState);
        window.renderFrame();
      }
    };

    window.setCameraView = function(viewName) {
      document.getElementById('lbl-view').textContent = viewName.toUpperCase();
      if (viewName === 'three_quarter') {
        camera.position.set(4.6, 2.0, 4.6);
        camera.lookAt(0, 0.58, 0);
      } else if (viewName === 'full_inspection') {
        camera.position.set(4.8, 2.6, 4.4);
        camera.lookAt(0, 0.55, 0);
      } else if (viewName === 'cockpit') {
        // Position inside cockpit looking toward driver instruments & center console
        camera.position.set(-0.32, 0.95, -0.05);
        camera.lookAt(-0.20, 0.72, 1.15);
      } else if (viewName === 'dashboard') {
        // Close-up on steering wheel, tachometer, auxiliary pods, and center display
        camera.position.set(-0.35, 0.86, 0.45);
        camera.lookAt(-0.35, 0.74, 1.05);
      } else if (viewName === 'doors_open') {
        // Perspective showing open doors, inner door cards, window glass, and sill
        camera.position.set(3.6, 1.8, 2.2);
        camera.lookAt(-0.1, 0.55, 0.2);
      } else if (viewName === 'hood_open') {
        // Perspective looking down into front bay (engine or frunk tub)
        camera.position.set(2.2, 2.2, 2.8);
        camera.lookAt(0, 0.65, 1.3);
      } else if (viewName === 'boot_open') {
        // Perspective looking down into rear bay (rear engine or cargo trunk)
        camera.position.set(2.2, 2.2, -2.8);
        camera.lookAt(0, 0.65, -1.3);
      }
      camera.updateProjectionMatrix();
      window.renderFrame();
    };

    window.renderFrame = function() {
      renderer.render(scene, camera);
      window.isReady = true;
    };

    window.isReady = true;
  </script>
</body>
</html>
